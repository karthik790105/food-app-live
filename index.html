<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Taste - Food Delivery & Order Tracking</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; margin-bottom: 5px; }
    .nav { text-align: center; margin-bottom: 20px; }
    .nav a { color: #e67e22; text-decoration: none; font-weight: bold; }

    /* Search and Filter Styling */
    .filter-container { max-width: 1100px; margin: 0 auto 20px auto; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .search-bar { width: 100%; max-width: 500px; padding: 10px 15px; border: 2px solid #ddd; border-radius: 25px; font-size: 1rem; outline: none; transition: border 0.2s; }
    .search-bar:focus { border-color: #e67e22; }
    .categories { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip { padding: 6px 14px; background: #e0e0e0; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: #555; }
    .chip.active, .chip:hover { background: #e67e22; color: white; }

    /* Order Tracker Box */
    .tracker-card { max-width: 1100px; margin: 0 auto 25px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    .tracker-input-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .tracker-input { padding: 8px 15px; border: 1px solid #ccc; border-radius: 5px; width: 280px; }
    .tracker-btn { padding: 8px 18px; background: #2980b9; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .tracker-btn:hover { background: #3498db; }
    .status-display { margin-top: 15px; font-weight: bold; font-size: 1.1rem; color: #2c3e50; display: none; }

    /* History Pills */
    .history-list { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    .history-pill { background: #f0f3f6; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; cursor: pointer; color: #334155; font-weight: 600; }
    .history-pill:hover { background: #e2e8f0; border-color: #94a3b8; }

    .main-layout { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
    .menu-section { flex: 2; min-width: 300px; }
    .cart-section { flex: 1; min-width: 280px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: fit-content; position: sticky; top: 20px; }

    .grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: white; padding: 15px; border-radius: 10px; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0 5px 0; color: #2c3e50; font-size: 1.1em; }
    .price { font-weight: bold; color: #27ae60; font-size: 1.1em; margin: 5px 0; }
    .tag { background: #eee; padding: 3px 8px; border-radius: 5px; font-size: 0.8em; }
    
    .btn { margin-top: 10px; width: 100%; padding: 8px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #d35400; }
    .btn-checkout { background: #27ae60; margin-top: 15px; }
    .btn-checkout:hover { background: #219150; }

    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .cart-item-title { font-weight: bold; font-size: 0.95em; }
    .cart-total { font-size: 1.2em; font-weight: bold; margin-top: 15px; text-align: right; color: #2c3e50; }
  </style>
</head>
<body>

  <h1>🍕 Local Taste</h1>
  <div class="nav"><a href="orders.html">Go to Admin Orders Dashboard →</a></div>

  <!-- Order Tracker Box -->
  <div class="tracker-card">
    <h3 style="margin: 0;">📍 Track Your Order Live</h3>
    <div class="tracker-input-group">
      <input type="text" id="track-order-id" class="tracker-input" placeholder="Paste your Order ID here..." />
      <button class="tracker-btn" onclick="trackOrder()">Track Order</button>
    </div>
    <div id="status-display" class="status-display"></div>

    <!-- Saved Orders Quick Links -->
    <div id="history-container" style="margin-top: 15px; display: none;">
      <small style="color: #64748b; font-weight: bold;">Your Recent Orders (Click to Track):</small>
      <div id="history-pills" class="history-list"></div>
    </div>
  </div>

  <!-- Search & Category Filters -->
  <div class="filter-container">
    <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search dishes (e.g. Pizza, Burger)..." oninput="applyFilters()" />
    <div class="categories" id="category-chips">
      <button class="chip active" onclick="selectCategory('All', this)">All</button>
      <button class="chip" onclick="selectCategory('Pizza', this)">Pizza</button>
      <button class="chip" onclick="selectCategory('Burger', this)">Burger</button>
      <button class="chip" onclick="selectCategory('Main Course', this)">Main Course</button>
      <button class="chip" onclick="selectCategory('Drinks', this)">Drinks</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- Menu -->
    <div class="menu-section">
      <div id="food-container" class="grid">Loading menu items...</div>
    </div>

    <!-- Cart -->
    <div class="cart-section">
      <h2>🛒 Your Cart</h2>
      <div id="cart-container">Your cart is empty.</div>
      <div class="cart-total" id="cart-total">Total: ₹0</div>
      <button class="btn btn-checkout" onclick="checkoutCart()">Place Order</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://food-app-backend-cifu.onrender.com';
    let allMenuItems = [];
    let activeCategory = 'All';
    let cart = [];

    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80';

    async function fetchMenu() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/foods`);
        const result = await response.json();
        if (result.data) {
          allMenuItems = result.data;
          renderMenu(allMenuItems);
        }
      } catch (err) {
        console.error(err);
        document.getElementById('food-container').innerText = 'Failed to load menu.';
      }
    }

    function renderMenu(items) {
      const container = document.getElementById('food-container');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p>No matching food items found.</p>';
        return;
      }

      items.forEach(item => {
        const imageUrl = item.image || DEFAULT_IMAGE;
        container.innerHTML += `
          <div class="card">
            <div>
              <img src="${imageUrl}" alt="${item.name}" />
              <h3>${item.name}</h3>
              <p><span class="tag">${item.category}</span></p>
              <p class="price">₹${item.price}</p>
              <p>⭐ ${item.rating}</p>
            </div>
            <button class="btn" onclick="addToCart('${item.name}', ${item.price})">+ Add to Cart</button>
          </div>
        `;
      });
    }

    function selectCategory(category, element) {
      activeCategory = category;
      document.querySelectorAll('.chip').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      
      const filtered = allMenuItems.filter(item => {
        const matchesCategory = activeCategory === 'All' || item.category.toLowerCase() === activeCategory.toLowerCase();
        const matchesSearch = item.name.toLowerCase().includes(searchQuery) || item.category.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      renderMenu(filtered);
    }

    function addToCart(name, price) {
      const existing = cart.find(item => item.name === name);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ name, price, quantity: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-container');
      const totalEl = document.getElementById('cart-total');
      
      if (cart.length === 0) {
        container.innerHTML = 'Your cart is empty.';
        totalEl.innerText = 'Total: ₹0';
        return;
      }

      container.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <small>₹${item.price} x ${item.quantity}</small>
            </div>
            <div>
              <strong>₹${itemTotal}</strong>
            </div>
          </div>
        `;
      });

      totalEl.innerText = `Total: ₹${total}`;
    }

    async function checkoutCart() {
      if (cart.length === 0) {
        alert('Your cart is empty! Add items first.');
        return;
      }

      const customerName = prompt('Enter your name:');
      if (!customerName) return;

      const deliveryAddress = prompt('Enter delivery address:');
      if (!deliveryAddress) return;

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      try {
        const response = await fetch(`${API_BASE_URL}/api/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName,
            deliveryAddress,
            items: cart,
            totalPrice
          })
        });

        const result = await response.json();
        if (result.success) {
          const orderId = result.data._id;
          alert(`Order placed successfully for ${customerName}!\n\nSave your Order ID to track it:\n${orderId}`);
          
          // Save order to Local Storage history
          saveOrderToHistory(orderId, totalPrice);
          
          document.getElementById('track-order-id').value = orderId;
          cart = [];
          renderCart();
          trackOrder();
        } else {
          alert('Failed to place order.');
        }
      } catch (err) {
        console.error(err);
        alert('Error placing order.');
      }
    }

    // Live Order Tracker Function
    async function trackOrder() {
      const orderId = document.getElementById('track-order-id').value.trim();
      const statusDisplay = document.getElementById('status-display');

      if (!orderId) {
        alert('Please enter a valid Order ID.');
        return;
      }

      statusDisplay.style.display = 'block';
      statusDisplay.innerText = 'Checking order status...';

      try {
        const response = await fetch(`${API_BASE_URL}/api/orders`);
        const result = await response.json();

        if (result.data) {
          const match = result.data.find(o => o._id === orderId || o._id.slice(-6) === orderId);

          if (match) {
            let statusEmoji = '⏳';
            if (match.status === 'Preparing') statusEmoji = '👨‍🍳';
            if (match.status === 'Out for Delivery') statusEmoji = '🛵';
            if (match.status === 'Delivered') statusEmoji = '🎉';

            statusDisplay.innerHTML = `Order Status: <span style="color: #e67e22;">${match.status || 'Pending'} ${statusEmoji}</span><br><small style="font-size:0.8rem; font-weight:normal; color:#666;">Customer: ${match.customerName} | Total: ₹${match.totalPrice}</small>`;
          } else {
            statusDisplay.innerText = '❌ Order ID not found. Check the ID and try again.';
          }
        }
      } catch (err) {
        console.error(err);
        statusDisplay.innerText = 'Error checking order status.';
      }
    }

    // Local Storage History Helper Functions
    function saveOrderToHistory(orderId, price) {
      let history = JSON.parse(localStorage.getItem('my_orders') || '[]');
      history.unshift({ id: orderId, price, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      localStorage.setItem('my_orders', JSON.stringify(history.slice(0, 5))); // Keep last 5
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('my_orders') || '[]');
      const container = document.getElementById('history-container');
      const pillsContainer = document.getElementById('history-pills');

      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';
      pillsContainer.innerHTML = '';

      history.forEach(item => {
        pillsContainer.innerHTML += `
          <div class="history-pill" onclick="quickTrack('${item.id}')">
            #${item.id.slice(-6)} (₹${item.price}) - ${item.date}
          </div>
        `;
      });
    }

    function quickTrack(orderId) {
      document.getElementById('track-order-id').value = orderId;
      trackOrder();
    }

    fetchMenu();
    renderHistory();
  </script>
</body>
</html>
