<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Taste - Admin Orders</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
    h1 { text-align: center; color: #333; margin-bottom: 5px; }
    .nav { text-align: center; margin-bottom: 20px; }
    .nav a { color: #e67e22; text-decoration: none; font-weight: bold; }

    .container { max-width: 900px; margin: 0 auto; }
    .order-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .order-id { font-weight: bold; color: #2c3e50; }
    .order-status { font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; text-transform: uppercase; }
    
    /* Status Badge Colors */
    .status-Pending { background: #ffeaa7; color: #d63031; }
    .status-Preparing { background: #74b9ff; color: #0984e3; }
    .status-Out-for-Delivery { background: #a29bfe; color: #6c5ce7; }
    .status-Delivered { background: #55efc4; color: #00b894; }

    .items-list { margin: 10px 0; padding-left: 20px; color: #555; }
    .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    .total-price { font-size: 1.1em; font-weight: bold; color: #27ae60; }

    select { padding: 6px 10px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; }
    .btn-refresh { background: #e67e22; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
    .btn-refresh:hover { background: #d35400; }
  </style>
</head>
<body>

  <h1>👨‍🍳 Admin Orders Dashboard</h1>
  <div class="nav"><a href="index.html">← Back to Food Menu</a></div>

  <div class="container">
    <button class="btn-refresh" onclick="fetchOrders()">🔄 Refresh Orders</button>
    <div id="orders-list">Loading live orders...</div>
  </div>

  <script>
    const API_BASE_URL = 'https://food-app-backend-cifu.onrender.com';

    async function fetchOrders() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/orders`);
        const result = await response.json();

        const container = document.getElementById('orders-list');
        container.innerHTML = '';

        if (result.data && result.data.length > 0) {
          // Show newest orders first
          const orders = result.data.reverse();

          orders.forEach(order => {
            const itemsHtml = order.items ? order.items.map(i => `<li>${i.name} (x${i.quantity}) - ₹${i.price * i.quantity}</li>`).join('') : '<li>No item details</li>';
            const statusClass = `status-${(order.status || 'Pending').replace(/ /g, '-')}`;

            container.innerHTML += `
              <div class="order-card">
                <div class="order-header">
                  <div>
                    <span class="order-id">Order #${order._id.slice(-6)}</span>
                    <small>(${new Date(order.createdAt || Date.now()).toLocaleTimeString()})</small>
                  </div>
                  <span class="order-status ${statusClass}">${order.status || 'Pending'}</span>
                </div>

                <p><strong>Customer:</strong> ${order.customerName}</p>
                <p><strong>Address:</strong> ${order.deliveryAddress}</p>
                
                <strong>Items Ordered:</strong>
                <ul class="items-list">${itemsHtml}</ul>

                <div class="order-footer">
                  <span class="total-price">Total: ₹${order.totalPrice}</span>
                  <div>
                    <label><strong>Status: </strong></label>
                    <select onchange="updateOrderStatus('${order._id}', this.value)">
                      <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                      <option value="Preparing" ${order.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                      <option value="Out for Delivery" ${order.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                      <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                    </select>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p>No orders received yet.</p>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('orders-list').innerText = 'Failed to load orders.';
      }
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        const response = await fetch(`${API_BASE_URL}/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });

        const result = await response.json();
        if (result.success) {
          fetchOrders(); // Refresh screen after update
        } else {
          alert('Failed to update status.');
        }
      } catch (err) {
        console.error(err);
        alert('Error updating order status.');
      }
    }

    fetchOrders();
  </script>
</body>
</html>
