<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Live Orders</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
    h1 { text-align: center; color: #333; }
    .nav { text-align: center; margin-bottom: 20px; }
    .nav a { color: #e67e22; text-decoration: none; font-weight: bold; }
    .grid { display: flex; flex-direction: column; gap: 15px; max-width: 700px; margin: 0 auto; }
    .order-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #e67e22; }
    .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; font-weight: bold; }
    .status { background: #ffeaa7; color: #d63031; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; }
    .status.delivered { background: #badc58; color: #6ab04c; }
    .items-list { margin: 10px 0; color: #555; }
    .total { text-align: right; font-weight: bold; color: #27ae60; font-size: 1.1em; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ddd; }
    .btn-group { display: flex; gap: 8px; }
    .btn-update { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .btn-update:hover { background: #2980b9; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .btn-delete:hover { background: #c0392b; }
  </style>
</head>
<body>

  <h1>📦 Admin Orders Dashboard</h1>
  <div class="nav"><a href="index.html">← Back to Food Menu</a></div>
  
  <div id="orders-container" class="grid">Loading incoming orders...</div>

  <script>
    async function fetchOrders() {
      try {
        const response = await fetch('http://localhost:3000/api/orders');
        const result = await response.json();

        const container = document.getElementById('orders-container');
        container.innerHTML = '';

        if (result.data && result.data.length > 0) {
          result.data.reverse().forEach(order => {
            const itemsFormatted = order.items.map(i => `${i.name} (x${i.quantity || 1})`).join(', ');
            const date = new Date(order.createdAt).toLocaleString();
            const isDelivered = order.status === 'Delivered';

            container.innerHTML += `
              <div class="order-card">
                <div class="order-header">
                  <span>Customer: ${order.customerName}</span>
                  <span class="status ${isDelivered ? 'delivered' : ''}">${order.status}</span>
                </div>
                <p><strong>📍 Address:</strong> ${order.deliveryAddress}</p>
                <p class="items-list"><strong>🍕 Items:</strong> ${itemsFormatted}</p>
                <p style="font-size: 0.8em; color: #888;">🕒 Ordered at: ${date}</p>
                <div class="action-bar">
                  <div class="btn-group">
                    <button class="btn-update" onclick="updateStatus('${order._id}', '${order.status}')">Change Status</button>
                    <button class="btn-delete" onclick="deleteOrder('${order._id}')">Delete</button>
                  </div>
                  <div class="total">Total: ₹${order.totalPrice}</div>
                </div>
              </div>
            `;
          });
        } else {
          container.innerText = 'No orders placed yet.';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('orders-container').innerText = 'Failed to load orders.';
      }
    }

    async function updateStatus(orderId, currentStatus) {
      const nextStatus = currentStatus === 'Pending' ? 'Out for Delivery' : 'Delivered';
      
      try {
        const response = await fetch(`http://localhost:3000/api/orders/${orderId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: nextStatus })
        });
        const result = await response.json();
        if (result.success) {
          fetchOrders();
        }
      } catch (err) {
        alert('Failed to update status.');
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm('Are you sure you want to delete this order?')) return;

      try {
        const response = await fetch(`http://localhost:3000/api/orders/${orderId}`, {
          method: 'DELETE'
        });
        const result = await response.json();
        if (result.success) {
          fetchOrders();
        } else {
          alert('Failed to delete order.');
        }
      } catch (err) {
        alert('Error deleting order.');
      }
    }

    fetchOrders();
    setInterval(fetchOrders, 5000);
  </script>
</body>
</html>
